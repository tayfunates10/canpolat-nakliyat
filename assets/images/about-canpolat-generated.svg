<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">Canpolat Nakliyat Hakkımızda taşınma illüstrasyonu</title>
  <desc id="desc">Edremit rota vurgusu önünde paketli koltuk, koliler ve taşıma çalışanlarının bulunduğu kurumsal taşınma sahnesi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182536"/>
      <stop offset="1" stop-color="#253349"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27384d"/>
      <stop offset="1" stop-color="#142031"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#60738a" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#07111d" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1024" height="640" rx="32" fill="url(#bg)"/>
  <rect width="1024" height="640" rx="32" fill="url(#grid)"/>
  <path d="M0 492C162 450 302 478 446 454c179-30 309-8 578-66v252H0Z" fill="url(#floor)"/>

  <!-- Soyut Edremit rota ağı -->
  <g fill="none" stroke="#EF7C00" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 142c90 20 130 102 220 82 64-14 89-86 159-60 62 22 70 99 147 85 80-15 105-104 194-62 47 22 67 66 133 73" stroke-width="5" stroke-dasharray="8 13" opacity=".82"/>
    <path d="M99 390 205 322l95 56 114-105 104 45" stroke-width="4" opacity=".95"/>
    <g fill="#EF7C00" stroke="none">
      <circle cx="99" cy="390" r="8"/><circle cx="205" cy="322" r="8"/><circle cx="300" cy="378" r="8"/><circle cx="414" cy="273" r="8"/><circle cx="518" cy="318" r="8"/>
    </g>
  </g>

  <!-- Edremit konum işareti -->
  <g transform="translate(790 94)" filter="url(#shadow)">
    <path d="M46 0C20 0 0 20 0 46c0 35 46 82 46 82s46-47 46-82C92 20 72 0 46 0Z" fill="#EF7C00"/>
    <circle cx="46" cy="45" r="17" fill="#f7f8fa"/>
    <circle cx="46" cy="45" r="8" fill="#253349"/>
  </g>
  <text x="774" y="245" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#f7f8fa" letter-spacing="2">EDREMİT</text>
  <path d="M758 258h151" stroke="#EF7C00" stroke-width="4" stroke-linecap="round"/>

  <!-- Paketli koltuk -->
  <g transform="translate(496 318)" filter="url(#shadow)">
    <path d="M53 76V35c0-20 15-35 35-35h116c20 0 35 15 35 35v41" fill="#dfe4e8" stroke="#eef2f5" stroke-width="5"/>
    <path d="M39 76h214c17 0 31 14 31 31v101H8V107c0-17 14-31 31-31Z" fill="#cfd6dc" stroke="#eef2f5" stroke-width="5"/>
    <rect x="0" y="105" width="55" height="111" rx="24" fill="#bfc8d0" stroke="#eef2f5" stroke-width="5"/>
    <rect x="237" y="105" width="55" height="111" rx="24" fill="#bfc8d0" stroke="#eef2f5" stroke-width="5"/>
    <path d="M32 119 256 174M52 39l168 120M86 5l112 205M218 24 74 203" fill="none" stroke="#ffffff" stroke-opacity=".48" stroke-width="3"/>
    <path d="M32 118h224" stroke="#EF7C00" stroke-width="6" stroke-opacity=".8"/>
    <rect x="37" y="205" width="23" height="14" rx="3" fill="#111b29"/>
    <rect x="231" y="205" width="23" height="14" rx="3" fill="#111b29"/>
  </g>

  <!-- Koliler -->
  <g filter="url(#shadow)" stroke="#825d34" stroke-width="3">
    <g transform="translate(350 430)"><rect width="116" height="98" rx="7" fill="#c99455"/><path d="M58 0v98M0 28h116" opacity=".48"/><rect x="47" y="0" width="22" height="28" fill="#e0b47c" stroke="none"/></g>
    <g transform="translate(397 348)"><rect width="96" height="82" rx="7" fill="#d0a064"/><path d="M48 0v82M0 24h96" opacity=".48"/><rect x="39" y="0" width="20" height="24" fill="#e6be8b" stroke="none"/></g>
    <g transform="translate(305 491)"><rect width="86" height="73" rx="7" fill="#b98245"/><path d="M43 0v73M0 21h86" opacity=".48"/></g>
  </g>

  <!-- Çalışan 1: koli taşıyor -->
  <g transform="translate(123 279)" filter="url(#shadow)">
    <circle cx="56" cy="35" r="27" fill="#e0a67b"/>
    <path d="M31 27c3-24 47-32 56 0-16-6-38-5-56 0Z" fill="#EF7C00"/>
    <path d="M30 72c13-20 55-20 69 0l12 110H17Z" fill="#27384d"/>
    <path d="M35 88 4 145M94 88l44 48" stroke="#e0a67b" stroke-width="18" stroke-linecap="round"/>
    <path d="M39 181 22 274M89 181l18 93" stroke="#1b2636" stroke-width="26" stroke-linecap="round"/>
    <rect x="-4" y="113" width="122" height="91" rx="7" fill="#c99455" stroke="#825d34" stroke-width="3"/>
    <path d="M57 113v91M-4 141h122" stroke="#825d34" stroke-width="3" opacity=".55"/>
    <rect x="47" y="113" width="21" height="29" fill="#e0b47c"/>
    <path d="M7 274h36M89 274h39" stroke="#101924" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Çalışan 2: koltuğu paketliyor -->
  <g transform="translate(764 341)" filter="url(#shadow)">
    <circle cx="51" cy="28" r="24" fill="#d99b70"/>
    <path d="M27 21c7-22 42-26 51 1-17-5-34-5-51-1Z" fill="#EF7C00"/>
    <path d="M23 62c17-16 53-15 67 4l9 105H18Z" fill="#27384d"/>
    <path d="M29 84-12 138M84 84l-46 76" stroke="#d99b70" stroke-width="16" stroke-linecap="round"/>
    <path d="M37 169 21 252M78 169l18 83" stroke="#1b2636" stroke-width="24" stroke-linecap="round"/>
    <path d="M8 252h34M81 252h35" stroke="#101924" stroke-width="14" stroke-linecap="round"/>
    <rect x="-31" y="133" width="72" height="16" rx="8" fill="#EF7C00" transform="rotate(-24 5 141)"/>
  </g>

  <!-- Zemin gölgeleri -->
  <ellipse cx="206" cy="577" rx="122" ry="20" fill="#07111d" opacity=".3"/>
  <ellipse cx="623" cy="582" rx="235" ry="24" fill="#07111d" opacity=".35"/>

  <!-- Dekoratif marka çizgisi -->
  <rect x="48" y="50" width="94" height="7" rx="3.5" fill="#EF7C00"/>
  <circle cx="158" cy="53.5" r="4" fill="#EF7C00"/>
</svg>