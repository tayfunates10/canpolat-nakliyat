name: Section 00 QA

on:
  push:
    branches:
      - work/section-00-global-header-20260808
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section00:
    name: Static + responsive browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Repo bağımlılıklarını kur
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Mevcut production test zincirini çalıştır
        run: npm test

      - name: Bölüm 00 statik denetimini çalıştır
        run: node tests/section00-audit.js

      - name: Chromium test bağımlılığını geçici kur
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0

      - name: Chrome ve PHP ortamını doğrula
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          google-chrome --version

      - name: Gerçek PHP sitesini yerelde başlat
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:8099 > "${RUNNER_TEMP}/section00-php.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/section00-php.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/section00-php.log" || true
          exit 1

      - name: Responsive browser QA ve ekran görüntüleri
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SECTION00_BASE_URL: http://127.0.0.1:8099/
          SECTION00_ARTIFACT_DIR: artifacts/section-00
        run: node tests/section00-browser-audit.js

      - name: PHP sunucu logunu artifact klasörüne ekle
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/section-00
          cp "${RUNNER_TEMP}/section00-php.log" artifacts/section-00/php-server.log 2>/dev/null || true

      - name: Bölüm 00 QA artifactlerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-00-qa-${{ github.sha }}
          path: artifacts/section-00/
          if-no-files-found: error
          retention-days: 14
