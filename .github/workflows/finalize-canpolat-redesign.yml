name: Finalize Canpolat redesign

on:
  push:
    branches:
      - feat/canpolat-full-redesign
    paths:
      - '.github/workflows/finalize-canpolat-redesign.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feat/canpolat-full-redesign
          fetch-depth: 0

      - name: Refresh brand metadata and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '#0d1d2c': '#303640',
              '/assets/css/style.css?v=1': '/assets/css/style.css?v=2',
              '/assets/js/main.js?v=1': '/assets/js/main.js?v=2',
              'Taşınmanın planlı, <span>güven veren hâli.</span>': 'Canpolat güvencesiyle, <span>eksiksiz taşının.</span>',
              'Taşınma gününü belirsizlikten çıkarıyoruz.': 'Canpolat Nakliyat ile her adım kontrol altında.',
              'Her taşınma senaryosuna <span class="orange">uygun çözüm.</span>': 'Canpolat Nakliyat’tan <span class="orange">ihtiyaca özel çözüm.</span>',
              'Taşınma planınızı birlikte netleştirelim.': 'Canpolat Nakliyat ile taşınma planınızı netleştirelim.',
              'Turuncu `#F28C18`, lacivert `#14283B`, beyaz ve açık gri': 'Turuncu `#ED7B00`, koyu antrasit `#303640`, beyaz ve açık gri',
          }

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          manifest = Path('manifest.webmanifest')
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8').replace('#0d1d2c', '#303640')
              manifest.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              readme.write_text(text, encoding='utf-8')
          PY

          rm -f assets/css/canpolat-theme.css

      - name: Validate redesigned site
        shell: bash
        run: |
          set -euo pipefail
          node tests/site-audit.js
          grep -R "style.css?v=1\|main.js?v=1\|#0d1d2c" --include='*.html' --include='*.webmanifest' . && exit 1 || true
          grep -R "Okur Nakliyat" --include='*.html' . && exit 1 || true

      - name: Commit finalized redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/finalize-canpolat-redesign.yml
          git add -- '*.html' manifest.webmanifest README.md assets/css
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'feat: finalize full Canpolat visual redesign'
          git push origin HEAD:feat/canpolat-full-redesign
