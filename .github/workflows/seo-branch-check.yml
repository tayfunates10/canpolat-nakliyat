name: SEO Branch Quality Check

on:
  push:
    branches:
      - seo-local-2026-08-11
  pull_request:
    branches:
      - main
    paths:
      - 'bolgeler/**'
      - 'sitemap.xml'
      - 'tests/**'
      - 'scripts/prepare-deploy.sh'
      - 'package.json'
      - '.github/workflows/seo-branch-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canpolat-seo-branch-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run site tests without deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SEO branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541dca1515405c02a0891d1b43639c # v6
        with:
          node-version: '22'

      - name: Run production-equivalent test suite
        run: npm test
