name: Polish Canpolat assets

on:
  push:
    branches:
      - feat/canpolat-full-redesign
    paths:
      - '.github/workflows/polish-canpolat-assets.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canpolat-full-redesign
          fetch-depth: 0

      - name: Align embedded artwork and logo dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '#f28c18': '#ed7b00',
              '#F28C18': '#ED7B00',
              '#ffad4a': '#ff9d32',
              '#FFAD4A': '#FF9D32',
              '#14283b': '#303640',
              '#14283B': '#303640',
              '#17324a': '#484d5a',
              '#607080': '#686d77',
              'Turuncu ve lacivert detaylı': 'Turuncu ve koyu antrasit detaylı',
              'width="420" height="96"': 'width="560" height="118"',
          }

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          node tests/site-audit.js
          grep -R "#f28c18\|#14283b\|width=\"420\" height=\"96\"" --include='*.html' . && exit 1 || true

      - name: Commit polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/polish-canpolat-assets.yml
          git add -- '*.html'
          git commit -m 'fix: align all embedded Canpolat brand assets'
          git push origin HEAD:feat/canpolat-full-redesign
