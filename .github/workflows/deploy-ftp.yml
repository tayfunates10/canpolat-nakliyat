name: Canpolat Nakliyat FTP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_live_root:
        description: GitHub yayın paketinde bulunmayan eski canlı dosyaları sil
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: canpolat-production-ftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Test ve FTP ile yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Site denetimlerini çalıştır
        run: npm test

      - name: Yayın betiklerini doğrula
        run: |
          bash -n scripts/prepare-deploy.sh scripts/deploy-cpanel.sh scripts/validate-ftp-config.sh
          node --check scripts/clean-ftp-root.js

      - name: FTP yayın paketini hazırla
        run: |
          mkdir -p "${RUNNER_TEMP}/canpolat-site"
          scripts/prepare-deploy.sh "${RUNNER_TEMP}/canpolat-site"

      - name: FTP ayarlarını güvenli biçimde doğrula
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        run: scripts/validate-ftp-config.sh

      - name: Kontrollü temizlik bağımlılığını kur
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.clean_live_root == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[clean-live-root]'))
          }}
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Canlı FTP kökündeki eski dosyaları kontrollü temizle
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.clean_live_root == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[clean-live-root]'))
          }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_SECURITY: loose
          FTP_LOCAL_DIR: ${{ runner.temp }}/canpolat-site
          FTP_CLEAN_MODE: apply
          FTP_CLEAN_CONFIRM: canpolatnakliyat.com
          FTP_CLEAN_MAX_DELETE: '2000'
        run: node scripts/clean-ftp-root.js

      - name: Siteyi FTP ile canlıya dağıt
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ${{ runner.temp }}/canpolat-site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: .canpolat-ftp-deploy-state.json
          dangerous-clean-slate: false
          security: loose
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/cgi-bin/**

      - name: Canlı Hero R8-11 yayınını doğrula
        id: live_verify
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL="https://canpolatnakliyat.com"
          QUERY="verify=${GITHUB_SHA}"
          last_headers=""
          last_body=""
          last_old_code="000"
          last_r8_code="000"

          for attempt in $(seq 1 12); do
            echo "Canlı doğrulama denemesi ${attempt}/12"

            last_headers="$(curl -sS -L -D - -o /dev/null --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/?${QUERY}" || true)"
            last_body="$(curl -sS -L --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/?${QUERY}" || true)"
            last_old_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/images/hero-canpolat.webp?${QUERY}" || true)"
            last_r8_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/images/hero-r8/platform-p00-r8-reference-exact.png?${QUERY}" || true)"

            layer_count="$(grep -o 'hero-r8__layer' <<<"${last_body}" | wc -l | tr -d ' ')"

            if grep -qi '^x-hero-version:[[:space:]]*R8-11' <<<"${last_headers}" \
              && grep -q 'hero-r8__layer--p00' <<<"${last_body}" \
              && grep -q 'hero-r8__layer--t00' <<<"${last_body}" \
              && ! grep -q 'hero-canpolat\.webp' <<<"${last_body}" \
              && ! grep -q 'hero-canpolat-mobil\.webp' <<<"${last_body}" \
              && [[ "${last_old_code}" == "404" || "${last_old_code}" == "410" ]] \
              && [[ "${last_r8_code}" == "200" ]] \
              && (( layer_count >= 13 )); then
              echo "PASS: Canlı site R8-11 kullanıyor; eski hero servis edilmiyor."
              exit 0
            fi

            echo "Henüz doğrulanmadı: old=${last_old_code}, r8=${last_r8_code}, layers=${layer_count}"
            sleep 10
          done

          echo "FAIL: Canlı Hero R8-11 doğrulanamadı."
          echo "Eski hero HTTP: ${last_old_code}"
          echo "R8 platform HTTP: ${last_r8_code}"
          echo "Son headerlar:"
          printf '%s\n' "${last_headers}"
          exit 1

      - name: Canlı doğrulama durumunu commit'e yaz
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${LIVE_OUTCOME}" == "success" ]]; then
            STATE="success"
            DESCRIPTION="R8-11 canlı; eski hero kaldırıldı"
          else
            STATE="failure"
            DESCRIPTION="Canlı R8-11 doğrulaması başarısız"
          fi

          python3 - <<'PY' > "${RUNNER_TEMP}/status.json"
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "production/canpolat-live",
              "description": os.environ["DESCRIPTION"],
          }, ensure_ascii=False))
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          STATE: ${{ steps.live_verify.outcome == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.live_verify.outcome == 'success' && 'R8-11 live; legacy hero removed' || 'Live R8-11 verification failed' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"production/canpolat-live\",\"description\":\"${DESCRIPTION}\"}"

      - name: Canlı doğrulama başarısızsa yayını başarısız işaretle
        if: steps.live_verify.outcome != 'success'
        run: exit 1
