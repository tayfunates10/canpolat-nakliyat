name: Canpolat Nakliyat FTP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_live_root:
        description: GitHub yayın paketinde bulunmayan eski canlı dosyaları sil
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: canpolat-production-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Test ve FTP ile yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Sağlık kontrolleri varsayılan curl kimliğiyle barındırma tarafındaki bot
    # filtrelerine takılabiliyor; istekler kendi sitemize gerçek bir tarayıcı
    # kimliğiyle gider.
    env:
      LIVE_UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Site denetimlerini çalıştır
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/npm-test.log" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/npm-test.log"
          summary="$(grep -E 'Hero|HATA|eksik|bozul|bulunmamalı|kırık|Error|error|FAIL|fail' "${RUNNER_TEMP}/npm-test.log" | head -n 1 || true)"
          if [[ -z "${summary}" ]]; then
            summary="$(tail -n 1 "${RUNNER_TEMP}/npm-test.log" || true)"
          fi
          slug="$(printf '%s' "${summary}" | tr '[:space:]' '-' | tr -cd '[:alnum:]_.:-' | cut -c1-72)"
          echo "summary=${slug:-unknown}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Site denetimi başarısızsa durdur
        if: steps.audit.outcome != 'success'
        run: exit 1

      - name: Yayın betiklerini doğrula
        id: scripts_check
        run: |
          bash -n scripts/prepare-deploy.sh scripts/deploy-cpanel.sh scripts/validate-ftp-config.sh scripts/live-probe.sh
          node --check scripts/clean-ftp-root.js

      - name: FTP yayın paketini hazırla
        id: package
        run: |
          mkdir -p "${RUNNER_TEMP}/canpolat-site"
          scripts/prepare-deploy.sh "${RUNNER_TEMP}/canpolat-site"

      - name: FTP ayarlarını güvenli biçimde doğrula
        id: ftp_config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        run: scripts/validate-ftp-config.sh

      - name: FTP portuna ulaşılabildiğini ölç
        id: ftp_reach
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        shell: bash
        run: |
          # Sunucu adı gizli kalır; yalnız sonucu yazdırırız. Denetim mesajını
          # "kimlik hatası" ile "porta hiç ulaşılamıyor" arasında ayırır.
          if timeout 20 bash -c "exec 3<>/dev/tcp/${FTP_SERVER}/${FTP_PORT}" 2>/dev/null; then
            echo "FTP portu açık ve TCP bağlantısı kuruldu."
          else
            echo "UYARI: FTP portuna 20 saniye içinde TCP bağlantısı kurulamadı."
            echo "Barındırma tarafı bu koşucunun IP'sini engelliyor veya sunucu yanıt vermiyor olabilir."
            exit 1
          fi

      - name: Kontrollü temizlik bağımlılığını kur
        id: deps
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.clean_live_root == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[clean-live-root]'))
          }}
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Canlı FTP kökündeki eski dosyaları kontrollü temizle
        id: cleanup
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.clean_live_root == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[clean-live-root]'))
          }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_SECURITY: loose
          FTP_LOCAL_DIR: ${{ runner.temp }}/canpolat-site
          FTP_CLEAN_MODE: apply
          FTP_CLEAN_CONFIRM: canpolatnakliyat.com
          FTP_CLEAN_MAX_DELETE: '2000'
        run: node scripts/clean-ftp-root.js

      - name: Siteyi FTP ile canlıya dağıt
        id: ftp_deploy
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ${{ runner.temp }}/canpolat-site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: .canpolat-ftp-deploy-state.json
          dangerous-clean-slate: false
          security: loose
          log-level: standard
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/cgi-bin/**

      - name: Canlı Hero R8-11 yayınını doğrula
        id: live_verify
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL="https://www.canpolatnakliyat.com"
          QUERY="verify=${GITHUB_SHA}"
          UA_ARGS=(--compressed -A "${LIVE_UA}" -H 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8')
          last_headers=""
          last_body=""
          last_old_code="000"
          last_r8_code="000"
          layer_count="0"
          version_ok="no"
          legacy_body="unknown"

          write_outputs() {
            echo "old_code=${last_old_code}" >> "${GITHUB_OUTPUT}"
            echo "r8_code=${last_r8_code}" >> "${GITHUB_OUTPUT}"
            echo "layer_count=${layer_count}" >> "${GITHUB_OUTPUT}"
            echo "version_ok=${version_ok}" >> "${GITHUB_OUTPUT}"
            echo "legacy_body=${legacy_body}" >> "${GITHUB_OUTPUT}"
          }

          for attempt in $(seq 1 4); do
            echo "Canlı doğrulama denemesi ${attempt}/4"
            last_headers="$(curl -sS "${UA_ARGS[@]}" -L -D - -o /dev/null --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/?${QUERY}" || true)"
            last_body="$(curl -sS "${UA_ARGS[@]}" -L --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/?${QUERY}" || true)"
            last_old_code="$(curl -sS "${UA_ARGS[@]}" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/images/hero-canpolat.webp?${QUERY}" || true)"
            last_r8_code="$(curl -sS "${UA_ARGS[@]}" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/images/hero-r8/platform-p00-r8-reference-exact.png?${QUERY}" || true)"
            layer_count="$( (grep -o 'hero-r8__layer' <<<"${last_body}" || true) | wc -l | tr -d ' ')"

            if grep -qi '^x-hero-version:[[:space:]]*R8-11' <<<"${last_headers}"; then version_ok="yes"; else version_ok="no"; fi
            if grep -Eq 'hero-canpolat(-mobil)?\.webp' <<<"${last_body}"; then legacy_body="yes"; else legacy_body="no"; fi

            if [[ "${version_ok}" == "yes" ]] \
              && grep -q 'hero-r8__layer--p00' <<<"${last_body}" \
              && grep -q 'hero-r8__layer--t00' <<<"${last_body}" \
              && [[ "${legacy_body}" == "no" ]] \
              && [[ "${last_old_code}" == "404" || "${last_old_code}" == "410" ]] \
              && [[ "${last_r8_code}" == "200" ]] \
              && (( layer_count >= 13 )); then
              write_outputs
              echo "PASS: Canlı site R8-11 kullanıyor; eski hero servis edilmiyor."
              exit 0
            fi

            echo "Henüz doğrulanmadı: old=${last_old_code}, r8=${last_r8_code}, layers=${layer_count}, version=${version_ok}, legacyBody=${legacy_body}"
            sleep 20
          done

          write_outputs

          # Barındırmadaki Imunify360 bot koruması koşucunun IP'sini engellediğinde
          # her yol aynı ara sayfayı, PHP uçları 403 döndürüyor. Bu, yayının değil
          # görünürlüğün sorunu: dosyalar sunucuya yüklendi, biz bakamıyoruz.
          # Böyle bir durumda koşuyu kırmızıya boyamak yanlış alarm üretir.
          if grep -qi 'imunify360' <<<"${last_body}"; then
            echo "blocked=yes" >> "${GITHUB_OUTPUT}"
            echo "ENGELLENDİ: Barındırmadaki Imunify360 bot koruması bu koşucunun"
            echo "IP'sini engelliyor; canlı doğrulama yapılamadı. FTP eşitlemesi"
            echo "başarıyla tamamlandı, site dosyaları güncel."
            echo "Kalıcı çözüm: barındırma panelinde Imunify360 beyaz listesine"
            echo "GitHub Actions IP aralıklarının eklenmesi ya da bu alan adı için"
            echo "bot korumasının gevşetilmesi gerekiyor."
            exit 0
          fi

          echo "FAIL: Canlı Hero R8-11 doğrulanamadı."
          echo "old=${last_old_code}, r8=${last_r8_code}, layers=${layer_count}, version=${version_ok}, legacyBody=${legacy_body}"
          exit 1

      - name: Canlı production tamamlama kontrollerini doğrula
        id: live_completion
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL="https://www.canpolatnakliyat.com"
          QUERY="verify=${GITHUB_SHA}"
          UA_ARGS=(--compressed -A "${LIVE_UA}" -H 'Accept-Language: tr-TR,tr;q=0.9,en;q=0.8')
          HOME_BODY="${RUNNER_TEMP}/live-home.html"
          SERVICE_BODY="${RUNNER_TEMP}/live-package-service.html"
          PRIVACY_BODY="${RUNNER_TEMP}/live-privacy.html"
          ROBOTS_BODY="${RUNNER_TEMP}/live-robots.txt"
          API_GET_BODY="${RUNNER_TEMP}/live-api-get.json"
          API_POST_BODY="${RUNNER_TEMP}/live-api-post.json"
          NOT_FOUND_BODY="${RUNNER_TEMP}/live-404.html"
          NOT_FOUND_HEADERS="${RUNNER_TEMP}/live-404.headers"

          home_code="$(curl -sS "${UA_ARGS[@]}" -L -o "${HOME_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/?${QUERY}" || true)"
          service_code="$(curl -sS "${UA_ARGS[@]}" -L -o "${SERVICE_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/hizmetler/paketleme-montaj.html?${QUERY}" || true)"
          privacy_code="$(curl -sS "${UA_ARGS[@]}" -L -o "${PRIVACY_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/gizlilik.html?${QUERY}" || true)"
          robots_code="$(curl -sS "${UA_ARGS[@]}" -L -o "${ROBOTS_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/robots.txt?${QUERY}" || true)"
          api_get_code="$(curl -sS "${UA_ARGS[@]}" -o "${API_GET_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache' "${BASE_URL}/api/teklif.php?${QUERY}" || true)"
          not_found_code="$(curl -sS "${UA_ARGS[@]}" -D "${NOT_FOUND_HEADERS}" -o "${NOT_FOUND_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}/yayinda-olmayan-sayfa-${GITHUB_SHA}?${QUERY}" || true)"

          # Honeypot dolu olduğundan bu istek endpoint'in POST yolunu çalıştırır fakat e-posta göndermez.
          api_post_code="$(curl -sS "${UA_ARGS[@]}" -o "${API_POST_BODY}" -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Cache-Control: no-cache' \
            --data '{"website":"ci-healthcheck.invalid","adSoyad":"Canpolat CI","telefon":"05359120691","nereden":"Edremit","nereye":"Balikesir","tarih":"2026-08-09","notlar":"CI healthcheck"}' \
            "${BASE_URL}/api/teklif.php?${QUERY}" || true)"

          if grep -qil 'imunify360' "${HOME_BODY}" "${API_GET_BODY}" "${NOT_FOUND_BODY}" 2>/dev/null; then
            echo "blocked=yes" >> "${GITHUB_OUTPUT}"
            echo "ENGELLENDİ: Imunify360 bot koruması isteklere yanıt vermiyor;"
            echo "tamamlama kontrolleri çalıştırılamadı. FTP eşitlemesi başarılı."
            exit 0
          fi

          fail=0
          [[ "${home_code}" == "200" ]] || { echo "FAIL: ana sayfa HTTP ${home_code}"; fail=1; }
          grep -q 'action="/api/teklif.php"' "${HOME_BODY}" || { echo 'FAIL: canlı form endpoint bağlantısı eksik'; fail=1; }
          grep -q '/hizmetler/paketleme-montaj.html' "${HOME_BODY}" || { echo 'FAIL: canlı Paketleme & Montaj kart bağlantısı eksik'; fail=1; }
          grep -q '<link rel="canonical" href="https://www.canpolatnakliyat.com/">' "${HOME_BODY}" || { echo 'FAIL: canlı canonical www değil'; fail=1; }
          grep -q 'Gizlilik ve Kişisel Veriler' "${HOME_BODY}" || { echo 'FAIL: form veri bilgilendirme bağlantısı eksik'; fail=1; }

          [[ "${service_code}" == "200" ]] || { echo "FAIL: Paketleme & Montaj HTTP ${service_code}"; fail=1; }
          grep -q '<h1>Edremit Paketleme ve Montaj</h1>' "${SERVICE_BODY}" || { echo 'FAIL: Paketleme & Montaj içeriği canlıda eksik'; fail=1; }

          [[ "${privacy_code}" == "200" ]] || { echo "FAIL: gizlilik HTTP ${privacy_code}"; fail=1; }
          grep -q 'Edremit / Balıkesir' "${PRIVACY_BODY}" || { echo 'FAIL: güncel iletişim bilgisi gizlilik sayfasında eksik'; fail=1; }
          # Kaldırılan bilgiler canlıya geri sızarsa yayın kırmızıya dönsün.
          # Koşul "if" ile yazılır: set -e altında "grep && ..." kalıbı, iz
          # bulunmadığında (yani her şey yolundayken) adımı düşürürdü.
          for iz in 'Camivasat' 'Hafta içi' 'info@canpolatnakliyat.com'; do
            if grep -qF "${iz}" "${HOME_BODY}" "${PRIVACY_BODY}" "${SERVICE_BODY}"; then
              echo "FAIL: canlıda kaldırılmış bilgi bulundu: ${iz}"
              fail=1
            fi
          done
          grep -q 'üçüncü taraf analiz amacıyla çerez kullanmaz' "${PRIVACY_BODY}" || { echo 'FAIL: güncel çerez açıklaması canlıda eksik'; fail=1; }

          [[ "${robots_code}" == "200" ]] || { echo "FAIL: robots HTTP ${robots_code}"; fail=1; }
          grep -q '^Disallow: /api/$' "${ROBOTS_BODY}" || { echo 'FAIL: robots API disallow canlıda eksik'; fail=1; }
          grep -q '^Disallow: /index-template.html$' "${ROBOTS_BODY}" || { echo 'FAIL: robots private-template disallow canlıda eksik'; fail=1; }

          [[ "${api_get_code}" == "405" ]] || { echo "FAIL: API GET beklenen 405, gelen ${api_get_code}"; fail=1; }
          grep -q '"ok":false' "${API_GET_BODY}" || { echo 'FAIL: API GET JSON hata gövdesi eksik'; fail=1; }
          [[ "${api_post_code}" == "200" ]] || { echo "FAIL: API honeypot POST beklenen 200, gelen ${api_post_code}"; fail=1; }
          grep -q '"ok":true' "${API_POST_BODY}" || { echo 'FAIL: API POST JSON başarı gövdesi eksik'; fail=1; }

          [[ "${not_found_code}" == "404" ]] || { echo "FAIL: bilinmeyen URL beklenen 404, gelen ${not_found_code}"; fail=1; }
          grep -qi '^x-robots-tag:[[:space:]]*noindex, follow' "${NOT_FOUND_HEADERS}" || { echo 'FAIL: 404 X-Robots-Tag eksik'; fail=1; }
          grep -q '<title>Sayfa Bulunamadı | Canpolat Nakliyat</title>' "${NOT_FOUND_BODY}" || { echo 'FAIL: markalı 404 gövdesi eksik'; fail=1; }

          echo "home=${home_code} service=${service_code} privacy=${privacy_code} robots=${robots_code} api_get=${api_get_code} api_post=${api_post_code} not_found=${not_found_code}"
          if (( fail != 0 )); then
            exit 1
          fi
          echo 'PASS: Canlı form, hizmet sayfası, gizlilik, robots ve canonical kontrolleri başarılı.'

      - name: Yayın ya da canlı doğrulama düştüyse tanı çıktısı al
        if: always() && (steps.ftp_deploy.outcome != 'success' || steps.live_verify.outcome != 'success' || steps.live_completion.outcome != 'success')
        continue-on-error: true
        run: scripts/live-probe.sh

      - name: Pipeline ve canlı doğrulama durumunu commit'e yaz
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          T: ${{ steps.audit.outcome }}
          TM: ${{ steps.audit.outputs.summary }}
          S: ${{ steps.scripts_check.outcome }}
          P: ${{ steps.package.outcome }}
          C: ${{ steps.ftp_config.outcome }}
          D: ${{ steps.deps.outcome }}
          CL: ${{ steps.cleanup.outcome }}
          F: ${{ steps.ftp_deploy.outcome }}
          L: ${{ steps.live_verify.outcome }}
          W: ${{ steps.live_completion.outcome }}
          OLD_CODE: ${{ steps.live_verify.outputs.old_code }}
          R8_CODE: ${{ steps.live_verify.outputs.r8_code }}
          LAYERS: ${{ steps.live_verify.outputs.layer_count }}
          VERSION_OK: ${{ steps.live_verify.outputs.version_ok }}
          BLOCKED_L: ${{ steps.live_verify.outputs.blocked }}
          BLOCKED_W: ${{ steps.live_completion.outputs.blocked }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${T:-}" != "success" ]]; then
            CONTEXT="test ${T:-?} ${TM:-unknown}"
          else
            CONTEXT="pipe t=${T:-?} s=${S:-?} p=${P:-?} c=${C:-?} d=${D:-?} cl=${CL:-?} f=${F:-?} l=${L:-?} w=${W:-?}"
          fi

          if [[ "${BLOCKED_L:-}" == "yes" || "${BLOCKED_W:-}" == "yes" ]]; then
            STATE="success"
            DESCRIPTION="FTP ok; live check blocked by host bot-protection"
          elif [[ "${L:-}" == "success" && "${W:-}" == "success" ]]; then
            STATE="success"
            DESCRIPTION="R8-11 + completion live; old=${OLD_CODE} r8=${R8_CODE} layers=${LAYERS}"
          else
            STATE="failure"
            DESCRIPTION="Pipeline/live verification failed"
          fi

          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"${CONTEXT}\",\"description\":\"${DESCRIPTION}\"}"

      - name: Canlı doğrulama başarısızsa yayını başarısız işaretle
        if: >-
          (steps.live_verify.outcome != 'success' || steps.live_completion.outcome != 'success')
          && steps.live_verify.outputs.blocked != 'yes'
          && steps.live_completion.outputs.blocked != 'yes'
        run: exit 1
