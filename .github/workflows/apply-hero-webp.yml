name: Apply responsive hero WebP

on:
  push:
    branches:
      - main
    paths:
      - '.hero-assets/**'
      - '.github/workflows/apply-hero-webp.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode optimized WebP asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/hero
          base64 --decode .hero-assets/canpolat-hero-bg.b64 > assets/images/hero/canpolat-hero-bg.webp
          file assets/images/hero/canpolat-hero-bg.webp | grep -qi 'Web/P image'
          test "$(wc -c < assets/images/hero/canpolat-hero-bg.webp)" -gt 20000

      - name: Apply responsive hero background
        shell: bash
        run: |
          set -euo pipefail
          cat >> assets/css/style.css <<'CSS'

          /* Responsive Canpolat hero background — WebP */
          .hero{
            background-color:#1d2027;
            background-image:
              linear-gradient(90deg,rgba(24,27,34,.98) 0%,rgba(24,27,34,.93) 32%,rgba(24,27,34,.68) 57%,rgba(24,27,34,.22) 100%),
              url('/assets/images/hero/canpolat-hero-bg.webp?v=3');
            background-repeat:no-repeat;
            background-size:cover;
            background-position:center center;
          }
          .hero::before{display:none}
          .hero::after{
            z-index:-1;
            background:linear-gradient(180deg,rgba(16,18,23,.03) 55%,rgba(16,18,23,.58) 100%);
            background-size:100% 100%;
            mask-image:none;
          }

          @media (max-width:1020px){
            .hero{
              background-position:58% center;
            }
          }

          @media (max-width:700px){
            .hero{
              background-image:
                linear-gradient(180deg,rgba(24,27,34,.97) 0%,rgba(24,27,34,.91) 48%,rgba(24,27,34,.69) 72%,rgba(24,27,34,.38) 100%),
                url('/assets/images/hero/canpolat-hero-bg.webp?v=3');
              background-size:auto 100%;
              background-position:66% center;
            }
            .hero::after{
              background:linear-gradient(180deg,transparent 65%,rgba(16,18,23,.6) 100%);
            }
          }

          @media (min-width:1800px){
            .hero{
              background-size:cover;
              background-position:center 46%;
            }
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('/assets/css/style.css?v=2', '/assets/css/style.css?v=3')
              path.write_text(text, encoding='utf-8')

          htaccess = Path('.htaccess')
          text = htaccess.read_text(encoding='utf-8')
          marker = 'ExpiresByType image/svg+xml "access plus 1 year"'
          webp = '  ExpiresByType image/webp "access plus 1 year"'
          if webp.strip() not in text:
              text = text.replace(marker, marker + '\n' + webp)
          htaccess.write_text(text, encoding='utf-8')
          PY

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail
          node tests/site-audit.js
          grep -q "canpolat-hero-bg.webp" assets/css/style.css
          grep -q "style.css?v=3" index.html
          test -s assets/images/hero/canpolat-hero-bg.webp

      - name: Commit final hero implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- .hero-assets
          git rm -- .github/workflows/apply-hero-webp.yml
          git add -- assets/images/hero/canpolat-hero-bg.webp assets/css/style.css .htaccess '*.html' bolgeler hizmetler
          git commit -m 'feat: apply responsive WebP hero background'
          git push origin HEAD:main
