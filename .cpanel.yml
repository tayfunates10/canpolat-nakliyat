---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/canpolatnakliyat.com/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp index.html "$DEPLOYPATH"
    - /bin/cp hakkimizda.html "$DEPLOYPATH"
    - /bin/cp gizlilik.html "$DEPLOYPATH"
    - /bin/cp 404.html "$DEPLOYPATH"
    - /bin/cp robots.txt "$DEPLOYPATH"
    - /bin/cp sitemap.xml "$DEPLOYPATH"
    - /bin/cp .htaccess "$DEPLOYPATH"
    - /bin/cp -R assets "$DEPLOYPATH"
    - /bin/cp -R css "$DEPLOYPATH"
    - /bin/cp -R js "$DEPLOYPATH"
    - /bin/cp -R hizmetler "$DEPLOYPATH"
    - /bin/cp -R bolgeler "$DEPLOYPATH"
