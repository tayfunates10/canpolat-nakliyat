<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 720px; height: 72px; }
  body {
    font-family: "DejaVu Sans", sans-serif;
    background: linear-gradient(180deg, #22314a 0%, #1a2439 100%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, #ef7c00 0%, #ff9b33 42%, #ef7c00 100%);
  }
  .logo { height: 34px; width: auto; display: block; flex: none; }
  .spacer { flex: 1 1 auto; }
  .contact { display: flex; align-items: center; gap: 14px; flex: none; }
  .rule { width: 1px; height: 36px; background: rgba(255,255,255,.16); flex: none; }
  .phone {
    display: flex; align-items: center; gap: 9px;
    color: #fff; font-size: 23px; font-weight: 700; letter-spacing: .3px;
    line-height: 1; white-space: nowrap;
  }
  .phone svg { width: 20px; height: 20px; fill: #ef7c00; display: block; }
  .addr {
    display: flex; align-items: center; gap: 9px;
    color: rgba(255,255,255,.92); font-size: 16.5px; font-weight: 700; letter-spacing: .2px;
    line-height: 1; white-space: nowrap;
  }
  .addr svg { width: 17px; height: 17px; fill: #ef7c00; display: block; }
</style>
</head>
<body>
  <img class="logo" src="logo-light.svg" alt="">
  <span class="spacer"></span>
  <div class="contact">
    <div class="phone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.4h3.1c.7 0 1.3.5 1.4 1.2l.6 3.2c.1.6-.1 1.2-.6 1.5l-1.7 1.2c1.1 2.3 2.9 4.1 5.2 5.2l1.2-1.7c.4-.5.9-.7 1.5-.6l3.2.6c.7.1 1.2.7 1.2 1.4v3.1c0 1.3-1.1 2.3-2.4 2.2C11.5 20.9 3.1 12.5 2.4 4.8c-.1-1.3.9-2.4 2.2-2.4z"/></svg>
      0535 912 06 91
    </div>
    <span class="rule"></span>
    <div class="addr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c-4 0-7.2 3.2-7.2 7.2 0 5.2 6.4 11.6 6.7 11.9.3.3.7.3 1 0 .3-.3 6.7-6.7 6.7-11.9 0-4-3.2-7.2-7.2-7.2zm0 10a2.9 2.9 0 1 1 0-5.8 2.9 2.9 0 0 1 0 5.8z"/></svg>
      Edremit / Balıkesir
    </div>
  </div>
</body>
</html>
